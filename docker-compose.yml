# 로컬 개발용 PostgreSQL. 운영은 Neon을 쓴다 (docs/02-tech-stack.md 5절).
# 계정 · 비밀번호는 내 PC에서만 쓰는 개발용 값이다.
# 프로젝트 이름을 고정해 폴더를 옮겨도 같은 DB 볼륨(household-hub_db-data)을 쓴다.
name: household-hub

services:
  db:
    image: postgres:17-alpine
    container_name: household-hub-db
    environment:
      POSTGRES_USER: household
      POSTGRES_PASSWORD: household
      POSTGRES_DB: household_hub
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U household -d household_hub']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
